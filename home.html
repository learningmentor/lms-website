<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPlatform - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Home-specific styles */
        .home-container {
            overflow-y: auto;
            height: calc(100vh - 70px); /* Adjust based on navbar height */
        }

        .hero {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            text-align: center;
            padding: 80px 20px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 20px;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .hero .btn {
            font-size: 18px;
            padding: 15px 30px;
            background-color: #27ae60;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .hero .btn:hover {
            background-color: #219150;
        }

        .catalog {
            padding: 50px 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .catalog h2 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 30px;
            text-align: center;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .course-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .course-thumbnail {
            height: 180px;
            background-color: #34495e;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 48px;
        }

        .course-info {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .course-info h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 22px;
        }

        .course-info p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
            flex: 1;
        }

        .course-info .btn {
            text-align: center;
            text-decoration: none;
            display: block;
        }
        
        /* Thumbnails colors */
        .thumb-1 { background: linear-gradient(45deg, #e74c3c, #c0392b); }
        .thumb-2 { background: linear-gradient(45deg, #f1c40f, #f39c12); }
        .thumb-3 { background: linear-gradient(45deg, #9b59b6, #8e44ad); }
    </style>
</head>
<body>
    <!-- Shared Navigation Bar -->
    <header class="navbar">
        <div class="logo">EduPlatform</div>
        <div class="user-profile">
            <div class="avatar">U</div>
        </div>
    </header>

    <div class="home-container">
        <!-- Hero Section -->
        <section class="hero">
            <h1>Welcome to Your Learning Journey</h1>
            <p>Master new skills, advance your career, and achieve your goals.</
